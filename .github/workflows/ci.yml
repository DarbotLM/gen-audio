name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-vibevoice:
    # The locked `vibevoice` extra (torch 2.14.1+cpu, transformers 4.51.3,
    # accelerate 1.6.0, diffusers 0.39.0, librosa) must install from cp314
    # wheels alone on both shipping hosts: [tool.uv] no-build = true, and
    # --frozen means the committed uv.lock is used as-is, never re-resolved.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.9"
          python-version: "3.15.2"
          enable-cache: false
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: uv sync --frozen --extra vibevoice
        run: uv sync --frozen --extra vibevoice
      - name: Runtime import smoke (no VibeVoice checkout or weights in CI)
        run: uv run --frozen --no-sync python -c "import sys, torch, transformers, accelerate, diffusers, librosa, soundfile; print(sys.version.split()[0], torch.__version__, transformers.__version__, accelerate.__version__, diffusers.__version__, librosa.__version__)"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config xvfb
      - run: cargo test --locked --workspace --exclude gen-audio-desktop
      # PR #5 verification E2. The library WAVs are gitignored, so CI takes
      # their identity from schemas/asset-object/media.lock.json; build_assets
      # fails (never skips) when a WAV is neither on disk nor locked, when a
      # cube JSON's source_sha256 is not its clip's WAV, or when a cube file's
      # bytes differ from the sha256 media.lock.json "cubes" pins.
      - name: Regen gate (asset catalog, vectors)
        run: |
          cargo run --locked -p gen-audio-core --example build_assets -- --from-lock
          cargo run --locked -p gen-audio-core --example asset_vectors
          git diff --exit-code -- apps/desktop/public/library schemas
      # `cargo test` builds gen-audio-mcp's test harness, not the binary, so
      # target/debug/gen-audio-mcp does not exist until it is built here (debug
      # profile, the path the cp below reads).
      - name: Build MCP sidecar binary (debug)
        run: cargo build -p gen-audio-mcp
      - name: Stage MCP sidecar so desktop config can see externalBin
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/debug/gen-audio-mcp" "apps/desktop/src-tauri/binaries/gen-audio-mcp-${triple}"
      # cargo check only typechecks. The spawn-failure arm in lib.rs needs a
      # real run. xvfb covers a gtk test that wants a display.
      - name: Test the desktop crate
        run: xvfb-run --auto-servernum cargo test --locked -p gen-audio-desktop

  desktop-ui:
    # TypeScript 7 (~7.0.2) ships tsc as a per-platform native binary
    # (@typescript/typescript-<os>-<cpu>), so check it on Windows too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci
      - name: Asset object golden vectors + Ajv2020 (shared with cargo test)
        run: npm test
      - name: tsc --noEmit
        run: |
          npx --no-install tsc --version
          npx --no-install tsc --noEmit -p .
      - run: npm run build
      - name: Dist release gate
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/lib/release-gate.ps1 -Dist apps/desktop/dist

  windows-scripts:
    # PSScriptAnalyzer (pinned 1.24.0), Pester 5.7, the script-sprawl gate, and
    # the regen check (build_assets -FromLock: the library WAVs are gitignored,
    # so their identity comes from media.lock.json), under both PowerShell 7
    # and Windows PowerShell 5.1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer 1.24.0 (pwsh)
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Install PSScriptAnalyzer 1.24.0 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Install Pester 5.7.1 (pwsh and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          powershell -NoProfile -Command "Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck"
      - name: PSSA + Pester + sprawl + regen (pwsh 7)
        shell: pwsh
        run: ./scripts/test.ps1 -Tag ci-pwsh -FromLock -Skip Cargo,Npm
      - name: PSSA + Pester + sprawl + regen (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test.ps1 -Tag ci-winps -FromLock -Skip Cargo,Npm
