[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-audio"
version = "0.2.0"
description = "GenAID Audio toolkit: multi-speaker podcast synthesis, a 24 kHz publish chain, spectrograms, and a cube-revision sketch."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Darbot Labs" }]
keywords = ["audio", "tts", "podcast", "kokoro", "genaid"]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
kokoro = [
    "kokoro @ https://github.com/DarbotLM/kokoro/releases/download/py314-2026.11.22/kokoro-0.9.4-py3-none-any.whl",
    "kokoro-onnx @ https://github.com/DarbotLM/kokoro-onnx/releases/download/py314-2026.11.22/kokoro_onnx-0.6.1-py3-none-any.whl",
    "misaki[en,ko,zh,vi] @ https://github.com/DarbotLM/misaki/releases/download/py314-2026.11.22/misaki-0.9.4%2Bpy314.1-py3-none-any.whl",
    "fugashi>=1.5.2,<2",
    "jaconv>=0.5.0,<1",
    "pyopenjtalk-plus>=0.4.1.post9,<1",
]
kokoro-onnx = [
    "kokoro-onnx @ https://github.com/DarbotLM/kokoro-onnx/releases/download/py314-2026.11.22/kokoro_onnx-0.6.1-py3-none-any.whl",
    "misaki[en,ko,zh,vi] @ https://github.com/DarbotLM/misaki/releases/download/py314-2026.11.22/misaki-0.9.4%2Bpy314.1-py3-none-any.whl",
    "fugashi>=1.5.2,<2",
    "jaconv>=0.5.0,<1",
    "pyopenjtalk-plus>=0.4.1.post9,<1",
]
kokoro-torch = [
    "kokoro @ https://github.com/DarbotLM/kokoro/releases/download/py314-2026.11.22/kokoro-0.9.4-py3-none-any.whl",
    "misaki[en,zh] @ https://github.com/DarbotLM/misaki/releases/download/py314-2026.11.22/misaki-0.9.4%2Bpy314.1-py3-none-any.whl",
    "fugashi>=1.5.2,<2",
    "jaconv>=0.5.0,<1",
    "pyopenjtalk-plus>=0.4.1.post9,<1",
]
kokoro-gpu = [
    "kokoro-onnx @ https://github.com/DarbotLM/kokoro-onnx/releases/download/py314-2026.11.22/kokoro_onnx-0.6.1-py3-none-any.whl",
    "onnxruntime-gpu[cuda,cudnn]>=1.30.0,<2; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'",
]
misaki = [
    "misaki[en,ko,zh,vi] @ https://github.com/DarbotLM/misaki/releases/download/py314-2026.11.22/misaki-0.9.4%2Bpy314.1-py3-none-any.whl",
    "fugashi>=1.5.2,<2",
    "jaconv>=0.5.0,<1",
    "pyopenjtalk-plus>=0.4.1.post9,<1",
]
dev = [
    "pytest>=8",
]
asr = [
    "faster-whisper>=1.1",
    "av>=12,<17",
]
# VibeVoice-1.5B inference runtime (VibeVoice-community @ 952326d, which is
# located by env/config and never vendored). Inference only: datasets, gradio,
# peft, ml-collections, absl-py, av and aiortc from upstream's pyproject are
# fine-tuning / demo-UI deps and are deliberately left out. torch comes from
# the PyTorch CPU index (see [tool.uv.sources]); native inference packages must
# resolve to CPython 3.14 wheels.
vibevoice = [
    "torch==2.14.1",
    "transformers>=5.17.0,<6",
    "accelerate==1.15.0",
    "diffusers==0.39.0",
    "librosa>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/darbotlabs/gen-audio"
Documentation = "https://github.com/darbotlabs/gen-audio/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/darbotlabs/gen-audio/issues"

[project.scripts]
gen-audio-synth = "gen_audio.cli.synth:main"
gen-audio-improve = "gen_audio.cli.improve:main"
gen-audio-spectrogram = "gen_audio.cli.spectrogram:main"
gen-audio-cube = "gen_audio.cli.cube:main"
gen-audio-spectrogram-strip = "gen_audio.cli.spectrogram_strip:main"
gen-audio-compare = "gen_audio.cli.compare:main"
gen-audio-generate = "gen_audio.cli.generate:main"
gen-audio-release-gate = "gen_audio.cli.release_gate:main"
gen-audio-transcribe-vibevoice = "gen_audio.cli.transcribe_vibevoice:main"
gen-audio-voices = "gen_audio.cli.voices:main"
gen-audio-agent-yankers = "gen_audio.cli.agent_yankers:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gen_audio = ["data/**/*.json"]

[tool.uv]
# Lock only for the hosts we ship to (box/CI linux x86_64, SMAX win AMD64).
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# PyPI publishes a few pure-Python Misaki dependencies (for example jieba and
# UniDic metadata) only as sdists. uv still selects native wheels for compiled
# packages; the lock file pins every resolved archive hash.

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
